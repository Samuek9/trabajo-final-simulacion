[project]
name = "investment-sim"
version = "1.0.0"
description = "Simulación de eventos discretos de estrategias de inversión bajo incertidumbre (Medellín, Colombia)"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3", "pandas>=2.2", "scipy>=1.13", "plotly>=5.22", "openpyxl>=3.1", "streamlit>=1.50"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
